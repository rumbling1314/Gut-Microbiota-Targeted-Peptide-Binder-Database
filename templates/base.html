<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Gut Microbiota Targeted Peptide Design Database{% endblock %}</title>
    <script src="https://3dmol.org/build/3Dmol-min.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background:#f5f7fa; color:#333; line-height:1.6; }
        .navbar { background:linear-gradient(135deg,#1a5276 0%,#2980b9 100%); color:white; padding:0 2rem; box-shadow:0 2px 8px rgba(0,0,0,.15); }
        .navbar-inner { max-width:1200px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; height:60px; }
        .navbar-brand { font-size:1.1rem; font-weight:700; color:white; text-decoration:none; }
        .navbar-links { display:flex; gap:1.5rem; }
        .navbar-links a { color:rgba(255,255,255,.85); text-decoration:none; font-size:.92rem; }
        .navbar-links a:hover { color:white; }
        .container { max-width:1200px; margin:2rem auto; padding:0 1.5rem; }
        .card { background:white; border-radius:8px; box-shadow:0 1px 3px rgba(0,0,0,.08); padding:1.5rem; margin-bottom:1.5rem; }
        .stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:1rem; margin-bottom:2rem; }
        .stat-card { background:white; border-radius:8px; padding:1.2rem; text-align:center; box-shadow:0 1px 3px rgba(0,0,0,.08); border-top:4px solid #2980b9; }
        .stat-number { font-size:2.2rem; font-weight:700; color:#2980b9; }
        .stat-label { color:#666; font-size:.85rem; margin-top:.3rem; }
        .stat-highlight { border-top-color:#27ae60; }
        .stat-highlight .stat-number { color:#27ae60; }
        table { width:100%; border-collapse:collapse; font-size:.88rem; }
        th,td { padding:.65rem .9rem; text-align:left; border-bottom:1px solid #eee; }
        th { background:#f8f9fa; font-weight:600; color:#555; font-size:.8rem; }
        tr:hover { background:#f8fafc; }
        .search-box { display:flex; gap:.5rem; margin-bottom:1.5rem; }
        .search-box input { flex:1; padding:.55rem 1rem; border:1px solid #ddd; border-radius:6px; font-size:.95rem; }
        .search-box button { padding:.55rem 1.5rem; background:#2980b9; color:white; border:none; border-radius:6px; cursor:pointer; }
        .badge { display:inline-block; padding:.15rem .6rem; border-radius:10px; font-size:.75rem; font-weight:600; }
        .badge-blue { background:#e8f4fd; color:#2980b9; }
        .badge-green { background:#e8f8f0; color:#27ae60; }
        .badge-orange { background:#fef5e7; color:#e67e22; }
        .detail-grid { display:grid; grid-template-columns:180px 1fr; gap:.6rem; font-size:.93rem; }
        .detail-label { color:#888; font-weight:500; }
        .seq-box { background:#f8f9fa; border:1px solid #e9ecef; border-radius:6px; padding:.8rem; font-family:"Courier New",monospace; font-size:.83rem; word-break:break-all; margin-top:.4rem; }
        h1 { font-size:1.5rem; margin-bottom:1rem; color:#1a5276; }
        h2 { font-size:1.15rem; margin-bottom:.7rem; color:#2c3e50; }
        .empty-state { text-align:center; padding:2.5rem; color:#999; }
        a { color:#2980b9; text-decoration:none; }
        a:hover { text-decoration:underline; }
        #pdb-viewer { position:relative; width:100%; height:500px; border:1px solid #ddd; border-radius:8px; margin-top:1rem; background:#fafafa; overflow:hidden; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-inner">
            <a href="/" class="navbar-brand" title="Gut Microbiota Targeted Peptide Design Database">Gut Peptide Design DB</a>
            <div class="navbar-links">
                <a href="/">Home</a>
                <a href="/species">Species</a>
                <a href="/proteins">Target Proteins</a>
                <a href="/binders">Binders</a>
                <a href="/md">MD Analysis</a>
                <a href="/about">About</a>
            </div>
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
